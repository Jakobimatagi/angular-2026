<div class="max-w-6xl mx-auto p-8">
  <h1 class="text-3xl font-bold text-center mb-2">Angular Practice Projects</h1>
  <p class="text-center text-gray-600 mb-8">Vote for your favorite projects!</p>

  @if (!userId()) {
  <div class="w-1/2 mx-auto bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 text-center">
    <p class="text-blue-800">
      <mat-icon class="align-middle mr-2">info</mat-icon>
      <a routerLink="/auth" class="text-blue-600 hover:text-blue-800 underline font-medium"
        >Sign in</a
      >
      to vote on projects
    </p>
  </div>
  } @if (loading()) {
  <div class="flex justify-center items-center p-12">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
  } @else {
  <div class="grid gap-4">
    @for (button of buttons(); track button.path) {
    <div class="flex w-1/3 gap-4 mx-auto">
      <div class="flex items-center gap-1 w-1/2">
        <div class="flex items-center justify-center">
          <button
            mat-icon-button
            class="vote-btn w-8 h-8 flex items-center justify-center hover:bg-black/5 disabled:opacity-50 disabled:cursor-not-allowed"
            [style.color]="button.userVote === 1 ? '#ff4500' : '#999'"
            (click)="toggleVote(button.path, 1)"
            [disabled]="!userId() || votingInProgress()"
            [matTooltip]="userId() ? 'Upvote' : 'Sign in to vote'"
          >
            <mat-icon class="flex items-center justify-center">arrow_upward</mat-icon>
          </button>
          <span [style.color]="'#ff4500'">{{ button.upvotes }}</span>
        </div>

        <div class="flex justify-center items-center">
          <button
            mat-icon-button
            class="vote-btn w-8 h-8 flex items-center justify-center hover:bg-black/5 disabled:opacity-50 disabled:cursor-not-allowed"
            [style.color]="button.userVote === -1 ? '#7193ff' : '#999'"
            (click)="toggleVote(button.path, -1)"
            [disabled]="!userId() || votingInProgress()"
            [matTooltip]="userId() ? 'Downvote' : 'Sign in to vote'"
          >
            <mat-icon class="flex items-center justify-center">arrow_downward</mat-icon>
          </button>
          <span [style.color]="'#7193ff'">{{ button.downvotes }}</span>
        </div>
      </div>
      <div class="flex flex-col justify-center items-center">
        <button
          mat-flat-button
          [routerLink]="button.path"
          class="flex-1 flex flex-col justify-center"
        >
          <span>{{ button.label }}</span>
        </button>
      </div>
    </div>
    }
  </div>
  }
</div>
