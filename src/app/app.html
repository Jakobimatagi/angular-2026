<nav class="navbar">
  <button mat-icon-button routerLink="/" class="home-btn">
    <mat-icon>home</mat-icon>
  </button>
  <h1 class="navbar-title">Angular Portfolio</h1>
  <div class="spacer"></div>

  <div class="nav-actions">
    @if (loadingAuth()) {
    <mat-spinner diameter="32" class="auth-spinner"></mat-spinner>
    } @else if (session()) {
    <!-- <app-avatar [avatarUrl]="avatarUrl()" size="small"></app-avatar> -->
    <button mat-button (click)="navigateToAccount()" class="flex">
      <span>Account</span>
    </button>
    <button mat-button (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign Out</span>
    </button>
    } @else {
    <button mat-raised-button (click)="navigateToLogin()" class="sign-in-btn">
      <mat-icon>login</mat-icon>
      <span>Sign In</span>
    </button>
    }
  </div>
</nav>

<main class="content">
  <router-outlet />
</main>

<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);

    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    display: block;
    width: 100%;
    min-height: 100vh;
  }

  .navbar {
    display: flex;
    align-items: center;
    padding: 1rem 2rem;
    gap: 1rem;
    background: linear-gradient(135deg, var(--bright-blue) 0%, var(--electric-violet) 100%);
    border-bottom: 2px solid var(--vivid-pink);
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: 64px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .home-btn {
    flex-shrink: 0;
    color: white;
  }

  .spacer {
    flex: 1;
  }

  .navbar-title {
    font-size: 1.25rem;
    color: white;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .nav-actions button {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.5rem;
    white-space: nowrap;
    color: white;
  }

  .auth-spinner {
    color: white;
  }

  .sign-in-btn {
    background-color: white !important;
    color: var(--bright-blue) !important;
    font-weight: 600;
  }

  .sign-in-btn:hover {
    background-color: rgba(255, 255, 255, 0.9) !important;
  }

  .content {
    width: 100%;

    padding: 1rem;
  }

  @media screen and (max-width: 650px) {
    .navbar {

    }

    .navbar-title {

    }

      display: none;
    }
  }
</style>
